plugins {
    id 'java'
    // 테스트가 실행한 코드의 라인/분기를 측정한다. 애플리케이션 실행에는 영향을 주지 않는다.
    id 'jacoco'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.wonpick'
version = '0.0.1-SNAPSHOT'
description = 'WON-pick Trade 서버 (거래 관리)'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // REST API (Spring MVC + 내장 Tomcat + Jackson). Spring Boot 4에서 starter-web의 새 이름
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // 입력 검증 (@Valid, @NotNull, @Positive ...)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // JDBC (JdbcClient, 트랜잭션, HikariCP 커넥션 풀)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Swagger UI (springdoc-openapi 3.x = Spring Boot 4용)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

    // MySQL 드라이버
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.14'
}

// 기존 Controller/HTTP 계약 테스트와 구분해서 Service 단위 테스트만 실행하는 명령이다.
tasks.register('serviceTest', Test) {
    description = 'Runs only Service unit tests without Spring, a database, or HTTP servers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/service/*Test*.class'
    useJUnitPlatform()
    finalizedBy 'serviceCoverageReport'
}

// 분모도 Service 패키지로 한정한다. 이 수치를 전체 프로젝트 커버리지로 해석하면 안 된다.
tasks.register('serviceCoverageReport', JacocoReport) {
    description = 'Generates Service coverage using only serviceTest execution data.'
    group = 'verification'
    dependsOn tasks.named('serviceTest')
    executionData layout.buildDirectory.file('jacoco/serviceTest.exec')
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        include 'com/wonpick/trade/service/**'
    })
    reports {
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/service/html')
        xml.required = true
        xml.outputLocation = layout.buildDirectory.file('reports/jacoco/service/service.xml')
    }
}

// 필요할 때 기존 테스트까지 포함한 전체 프로젝트 리포트를 별도로 만들 수 있다.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
    }
}
