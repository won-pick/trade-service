# 혼자 테스트용 프로필 — 다른 서버 없이 Trade 서버 안의 가짜 Market/Payment(/stub/**)를 부른다 (Chat은 링크 주소에만 쓰임)
# 실행: 프로필 stub 활성화 (IntelliJ Active profiles: stub, 또는 ./gradlew bootRun --args='--spring.profiles.active=stub')
servers:
  market:
    base-url: http://localhost:8083/stub/market
  chat:
    base-url: http://localhost:8080
  payment:
    base-url: http://localhost:8083/stub/payment
